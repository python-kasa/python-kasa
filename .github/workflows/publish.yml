---
name: Publish Packages

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: 3.13

jobs:
  build-n-publish:
    name: Build Release Packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Checkout Source Files
      id: checkout
      uses: actions/checkout@v7.0.1

    - name: Setup uv
      id: setup-uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version-file: uv.lock
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Build and Check Packages
      id: build-packages
      uses: $/.github/actions/build-packages

    - name: Publish Release on PyPI
      id: publish-release-on-pypi
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        # Metadata is already verified by the build action, same as in CI.
        verify-metadata: false

    - name: Write Release Summary
      id: release-summary
      env:
        TAG: ${{ github.event.release.tag_name }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        {
          echo "## python-kasa $TAG"
          echo
          echo "- Commit: [${GITHUB_SHA:0:8}]($REPO_URL/commit/$GITHUB_SHA)"
          echo "- Changelog: [CHANGELOG.md]($REPO_URL/blob/$TAG/CHANGELOG.md)"
          echo "- PyPI: https://pypi.org/project/python-kasa/$TAG/"
          echo
          echo "| File | SHA256 |"
          echo "| --- | --- |"
          cd dist
          sha256sum -- * | while read -r sum file; do echo "| $file | \`$sum\` |"; done
        } >> "$GITHUB_STEP_SUMMARY"
